<title>All-in-One App – Product Design Preview</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
:root,[data-theme="light"]{--on:#fff;--bg:#F3F5F9;--sf:#fff;--sf2:#EDF0F6;--ink:#0E1A2B;--mu:#5B687B;--bd:#E1E6EE;--pri:#2F4BD9;--pri-s:#E9EDFC;--fit:#4A5A72;--fit-s:#EDF0F5;--map:var(--pri);--map-s:var(--pri-s);--prj:#4A5A72;--prj-s:#EDF0F5;--ok:#15803D;--ok-s:#E3F5E9;--warn:#B45309;--warn-s:#FEF3C7;--sh:0 1px 2px rgba(14,26,43,.06),0 4px 14px rgba(14,26,43,.05);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
[data-theme="dark"]{--on:#0B111A;--bg:#0B111A;--sf:#141C28;--sf2:#1B2535;--ink:#EAF0F8;--mu:#93A0B4;--bd:#243044;--pri:#7C96FF;--pri-s:#1A2547;--fit:#A9B6CA;--fit-s:#222E42;--map:var(--pri);--map-s:var(--pri-s);--prj:#A9B6CA;--prj-s:#222E42;--ok:#4ADE80;--ok-s:#12301F;--warn:#FBBF24;--warn-s:#3A2E10;--sh:none;color-scheme:dark}
*{box-sizing:border-box;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--ink);font:500 14px/1.5 Manrope,system-ui,sans-serif;padding:16px;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.bar{max-width:1200px;margin:0 auto 16px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.bar h1{font-size:18px;font-weight:800;letter-spacing:-.01em}.bar p{color:var(--mu);font-size:12px}
.seg{display:inline-flex;background:var(--sf2);border-radius:10px;padding:3px;gap:2px}
.seg button{padding:6px 12px;border-radius:8px;font-weight:700;font-size:13px;color:var(--mu)}
.seg button.on{background:var(--sf);color:var(--ink);box-shadow:var(--sh)}
.stage{max-width:1200px;margin:0 auto}
.frame{container-type:inline-size;background:var(--bg);border:1px solid var(--bd);border-radius:22px;overflow:hidden;height:min(840px,calc(100vh - 110px));min-height:580px;box-shadow:var(--sh)}
.stage.mobile .frame{width:min(390px,100%);margin:0 auto;border-width:6px;border-color:var(--ink);border-radius:36px}
.stage.all{display:grid;gap:22px}.stage.all .frame{height:720px}.stage.all .frame.d{height:660px}
.g6{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:22px}
.cap{display:flex;justify-content:space-between;align-items:center;margin:0 4px 8px;font-weight:700;font-size:13px}.cap button{color:var(--pri);font-size:12px;font-weight:700}
.tok{display:flex;flex-wrap:wrap;gap:18px;align-items:center;background:var(--sf);border:1px solid var(--bd);border-radius:16px;padding:16px}
.tok i{display:inline-block;width:34px;height:34px;border-radius:10px;vertical-align:middle;margin-right:8px;border:1px solid var(--bd)}.tok span{font-size:12px;font-weight:700;margin-right:6px}
.app{height:100%;display:grid;grid-template-columns:1fr;grid-template-rows:auto auto 1fr auto;grid-template-areas:"sb""top""main""nav"}
.sb{grid-area:sb;display:flex;justify-content:space-between;padding:10px 22px 0;font-weight:800;font-size:12px;background:var(--sf)}
.top{grid-area:top;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 16px 14px;background:var(--sf);border-bottom:1px solid var(--bd)}
.top h2{font-size:20px;font-weight:800;letter-spacing:-.02em;line-height:1.2}.top small{color:var(--mu);font-size:12px;font-weight:600}
.srch{display:none;align-items:center;gap:8px;background:var(--sf2);border-radius:10px;padding:9px 12px;color:var(--mu);min-width:260px;font-size:13px}
.ico{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--sf2);color:var(--mu)}
.av{width:36px;height:36px;border-radius:50%;background:var(--ink);color:var(--sf);display:grid;place-items:center;font-weight:800;font-size:13px}
.act{display:flex;gap:8px;align-items:center}
.main{grid-area:main;overflow:auto;padding:16px;display:grid;gap:14px;align-content:start}
.bnav{grid-area:nav;display:grid;grid-template-columns:repeat(5,1fr);background:var(--sf);border-top:1px solid var(--bd);padding:6px 4px 10px}
.bnav button{display:grid;justify-items:center;gap:2px;padding:6px 0;font-size:11px;font-weight:700;color:var(--mu)}.bnav .on{color:var(--pri)}
.side{grid-area:side;display:none;flex-direction:column;gap:2px;padding:20px 14px;background:var(--sf);border-right:1px solid var(--bd)}
.brand{display:flex;gap:10px;align-items:center;padding:0 8px 18px;font-weight:800;font-size:16px}.brand b{width:32px;height:32px;border-radius:9px;background:var(--ink);color:var(--sf);display:grid;place-items:center}.brand small{display:block;font-size:11px;color:var(--mu);font-weight:600}
.side button{display:flex;gap:12px;align-items:center;padding:10px 12px;border-radius:10px;font-weight:700;color:var(--mu);text-align:left}.side button.on{background:var(--pri-s);color:var(--pri)}
.side .sync{margin-top:auto;border:1px solid var(--bd);border-radius:12px;padding:12px;font-size:12px;color:var(--mu)}.side .sync b{display:block;color:var(--ink);font-size:13px}
@container (min-width:820px){
.app{grid-template-columns:240px 1fr;grid-template-rows:auto 1fr;grid-template-areas:"side top""side main"}
.side{display:flex}.bnav,.sb{display:none}.srch{display:flex}.top{padding:16px 28px}.main{padding:24px 28px;gap:20px}.cols{grid-template-columns:1.5fr 1fr!important}.cols.eq{grid-template-columns:320px 1fr!important}}
.cols{display:grid;grid-template-columns:1fr;gap:16px;align-items:start}.stack{display:grid;gap:16px}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:16px;padding:16px;box-shadow:var(--sh)}
.card h3{font-size:15px;font-weight:800;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;letter-spacing:-.01em}.card h3 span{font-size:12px;color:var(--mu);font-weight:600}
.next{background:var(--ink);color:var(--sf);border-radius:20px;padding:20px;display:grid;gap:14px}
.next small{opacity:.7;font-weight:600}.next h3{font-size:24px;letter-spacing:-.02em;line-height:1.2;font-weight:800}
.next .btn{background:var(--sf);color:var(--ink)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:700;background:var(--pri-s);color:var(--pri)}
.pill.f{background:var(--fit-s);color:var(--fit)}.pill.m{background:var(--map-s);color:var(--map)}.pill.w{background:var(--warn-s);color:var(--warn)}.pill.p{background:var(--prj-s);color:var(--prj)}
.btn{display:inline-flex;gap:8px;align-items:center;justify-content:center;background:var(--pri);color:var(--on);font-weight:700;padding:11px 16px;border-radius:12px}
.btn.s{background:var(--pri-s);color:var(--pri)}.btn.f{background:var(--fit)}.btn.m{background:var(--map)}.btn[disabled]{opacity:.45;cursor:not-allowed}.btn.w{width:100%}
.qa{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.qa button{background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:12px 6px;font-weight:700;font-size:12px;display:grid;gap:6px;justify-items:center}
.qa .ico{width:38px;height:38px}
.row{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--bd)}.row:first-of-type{border-top:0;padding-top:0}.row:last-child{padding-bottom:0}
.row .t{width:48px;font-size:12px;font-weight:700;color:var(--mu)}.row .bar2{width:4px;align-self:stretch;border-radius:4px}
.row div{flex:1;min-width:0}.row b{display:block;font-weight:700}.row small{color:var(--mu);font-weight:500;font-size:12px}
.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{padding:6px 12px;border-radius:99px;background:var(--sf);border:1px solid var(--bd);font-size:12px;font-weight:700;color:var(--mu)}.chip.on{background:var(--ink);color:var(--sf);border-color:var(--ink)}
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}.wk span{padding:8px 0;border-radius:12px;font-size:11px;color:var(--mu);font-weight:700;display:grid;gap:2px}.wk span b{font-size:15px;color:var(--ink)}.wk .on{background:var(--pri);color:var(--on)}.wk .on b{color:var(--on)}
.tl{position:relative;height:560px;margin-left:44px}
.tl i{position:absolute;left:0;right:0;border-top:1px solid var(--bd)}.tl i em{position:absolute;left:-44px;top:-8px;font-size:11px;color:var(--mu);font-style:normal;font-weight:600}
.ev{position:absolute;border-radius:10px;padding:6px 9px;border-left:4px solid;font-size:12px;font-weight:700;overflow:hidden;line-height:1.3}.ev small{display:block;font-weight:500;opacity:.8}
.now{position:absolute;left:-6px;right:0;border-top:2px solid var(--map)}.now:before{content:"";position:absolute;left:0;top:-5px;width:8px;height:8px;border-radius:50%;background:var(--map)}
.note{display:flex;gap:10px;align-items:flex-start;background:var(--warn-s);color:var(--warn);padding:12px;border-radius:12px;font-size:12px;font-weight:600}.note.b{background:var(--pri-s);color:var(--pri)}
.steps{display:flex;gap:8px}.steps div{flex:1;font-size:12px;font-weight:700;color:var(--mu)}.steps div:before{content:"";display:block;height:4px;border-radius:4px;background:var(--bd);margin-bottom:6px}.steps .on{color:var(--ink)}.steps .on:before{background:var(--pri)}
.fld{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:12px;background:var(--sf2);border-radius:12px;margin-top:8px}.fld small{color:var(--mu);font-weight:600;font-size:12px}.fld.lo{outline:2px solid var(--warn)}
.file{display:flex;gap:12px;align-items:center}.file .ico{background:var(--pri-s);color:var(--pri)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stats b{display:block;font-size:22px;font-weight:800;letter-spacing:-.02em}.stats small{color:var(--mu);font-size:12px}
.map{border-radius:16px;overflow:hidden;border:1px solid var(--bd);position:relative}.map .s{position:absolute;left:12px;right:12px;top:12px;display:flex;gap:8px;align-items:center;background:var(--sf);padding:10px 12px;border-radius:12px;box-shadow:var(--sh);color:var(--mu);font-size:13px}
.alt{display:flex;justify-content:space-between;padding:12px;border:1px solid var(--bd);border-radius:12px;margin-bottom:8px}.alt.on{border-color:var(--map);background:var(--map-s)}.alt b{font-size:18px;letter-spacing:-.02em}
.tg{width:40px;height:24px;border-radius:99px;background:var(--bd);position:relative;flex:none}.tg:after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff}.tg.on{background:var(--pri)}.tg.on:after{left:19px}
.pipe{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center;font-size:11px;font-weight:700;color:var(--mu)}.pipe span:before{content:"";display:block;height:6px;border-radius:6px;background:var(--bd);margin-bottom:6px}.pipe .d:before{background:var(--fit)}.pipe .c{color:var(--ink)}.pipe .c:before{background:var(--warn)}
.lbl{font-size:12px;color:var(--mu);font-weight:700;margin:4px 0 -6px}
.th{padding:12px;background:var(--bg);color:var(--ink);border-radius:26px;border:1px solid var(--bd)}
.sec{display:flex;align-items:center;gap:10px;font-size:12px;font-weight:800;color:var(--mu);margin:4px 0 -4px}.sec:after{content:"";flex:1;height:1px;background:var(--bd)}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.kpi{border-radius:14px;padding:12px 14px;display:grid;gap:2px}.kpi b{font-size:26px;font-weight:800;letter-spacing:-.03em;line-height:1.1}.kpi small{font-size:12px;font-weight:700}.kpi span{font-size:11px;font-weight:600;opacity:.85}
.kpi.pri{background:var(--pri-s);color:var(--pri)}.kpi.fit{background:var(--fit-s);color:var(--fit)}.kpi.map{background:var(--map-s);color:var(--map)}.kpi.prj{background:var(--prj-s);color:var(--prj)}
.card.pri{border-top:3px solid var(--pri)}.card.fit{border-top:3px solid var(--fit)}.card.map{border-top:3px solid var(--map)}
.hl{background:var(--map-s);color:var(--map);padding:1px 8px;border-radius:6px;font-weight:800}
.lg{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;font-weight:700;color:var(--mu)}.lg i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:6px}
@container (min-width:820px){.kpis{grid-template-columns:repeat(4,1fr)}}
.sw{}
:root,[data-theme="light"]{--lift:0 1px 1px rgba(14,26,43,.04),0 3px 6px rgba(14,26,43,.05),0 10px 22px rgba(14,26,43,.06);--glow:0 0 0 1px rgba(47,75,217,.16),0 2px 4px rgba(47,75,217,.10),0 8px 18px rgba(47,75,217,.14),0 20px 38px rgba(47,75,217,.10)}
[data-theme="dark"]{--lift:0 1px 0 rgba(255,255,255,.04) inset,0 8px 20px rgba(0,0,0,.35);--glow:0 0 0 1px rgba(124,150,255,.40),0 0 16px rgba(124,150,255,.22),0 12px 30px rgba(0,0,0,.45)}
.card,.kpi{box-shadow:var(--lift)}
.card.pri,.card.fit,.card.map{border-top:1px solid var(--bd)}
.kpi,.kpi.pri,.kpi.fit,.kpi.map,.kpi.prj{background:var(--sf);color:var(--ink);border:1px solid var(--bd)}
.kpi small{color:var(--mu);font-weight:600}.kpi b{font-size:18px;font-weight:700;letter-spacing:-.01em}.kpi span{color:var(--mu);opacity:1;font-weight:500}
.kpi.pri,.kpi.map{background:linear-gradient(180deg,var(--sf),var(--pri-s));border-color:transparent;box-shadow:var(--glow)}.kpi.pri b,.kpi.map b{color:var(--pri)}
.next{background:radial-gradient(120% 90% at 100% 0%,rgba(124,150,255,.38),transparent 55%),var(--ink);box-shadow:var(--glow)}
.next h3{font-size:19px;font-weight:700}.top h2{font-size:18px;font-weight:700}.card h3,.brand{font-weight:700}.row b{font-weight:600}.alt b{font-size:15px}
.pill.ok{background:var(--ok-s);color:var(--ok)}.pipe .d:before{background:var(--ok)}.btn.f,.btn.m{background:var(--pri)}
</style>

<div class="bar">
  <div><h1>All-in-One App · product design preview</h1><p>Scheduler · Fitness · Map — one offline-first app (name to be decided)</p></div>
  <div class="act"><div class="seg" id="views"><button data-view="web">Web</button><button data-view="mobile">Mobile</button><button data-view="all">All parts</button></div><div class="seg" id="themes"><button data-th="light"><svg class="i" style="vertical-align:-5px;margin-right:4px"><use href="#sun"/></svg>Light</button><button data-th="dark"><svg class="i" style="vertical-align:-5px;margin-right:4px"><use href="#moon"/></svg>Dark</button></div></div>

<script>
var ic=function(n){return '<svg class="i"><use href="#'+n+'"/></svg>'};
var NAV=[["home","Home","home"],["sched","Scheduler","cal"],["fit","Fitness","dumb"],["map","Map","pin"],["acct","Account","user"]];
var TT={home:["Good morning, Alex","Thursday, November 12"],sched:["Scheduler","November 2026"],cor:["Upload COR","Create your class schedule"],fit:["Fitness","Week of November 9"],map:["Map","Philippines"],acct:["Account and sync","Alex Dela Cruz"]};
var PAR={cor:"sched"},S={view:"web",screen:"home",theme:"light"};

function line(v,l){var w=320,h=170,p=28,m=60,x=function(i){return p+i*(w-2*p)/(v.length-1)},y=function(n){return h-26-n/m*(h-50)},g="",k=v.length-1;
[0,30,60].forEach(function(f){var yy=y(f);g+='<line x1="'+p+'" x2="'+(w-p)+'" y1="'+yy+'" y2="'+yy+'" stroke="var(--bd)"/><text x="0" y="'+(yy+3)+'" font-size="9" fill="var(--mu)">'+f+'</text>'});
var pts=v.map(function(n,i){return x(i)+","+y(n)}).join(" ");
return '<svg viewBox="0 0 '+w+' '+h+'" width="100%" role="img" aria-label="Line graph of weekly exercise minutes">'+g+'<polygon points="'+x(0)+','+y(0)+' '+pts+' '+x(k)+','+y(0)+'" fill="var(--pri)" opacity=".1"/><polyline points="'+pts+'" fill="none" stroke="var(--pri)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>'+
v.map(function(n,i){return '<text x="'+x(i)+'" y="'+(h-6)+'" text-anchor="middle" font-size="10" fill="var(--mu)">'+l[i]+'</text>'+(i==k?'<circle cx="'+x(i)+'" cy="'+y(n)+'" r="5" fill="var(--sf)" stroke="var(--pri)" stroke-width="2.5"/><rect x="'+(x(i)-24)+'" y="'+(y(n)-30)+'" width="48" height="20" rx="6" fill="var(--ink)"/><text x="'+x(i)+'" y="'+(y(n)-16)+'" text-anchor="middle" font-size="10" font-weight="700" fill="var(--sf)">'+n+' min</text>':'<circle cx="'+x(i)+'" cy="'+y(n)+'" r="3" fill="var(--pri)"/>')}).join("")+'</svg>'}
var WK=line([20,35,0,45,30,50,40],["Mon","Tue","Wed","Thu","Fri","Sat","Sun"]);
function row(t,c,a,b,tag){return '<div class="row"><span class="t">'+t+'</span><span class="bar2" style="background:var(--'+c+')"></span><div><b>'+a+'</b><small>'+b+'</small></div>'+(tag||"")+'</div>'}
function ev(s,e,t,sub,c,col,n){var L=col*100/n;return '<div class="ev" style="top:'+(s-8)*56+'px;height:'+(e-s)*56+'px;left:'+L+'%;width:calc('+100/n+'% - 4px);background:var(--'+c+'-s);border-color:var(--'+c+')">'+t+'<small>'+sub+'</small></div>'}
